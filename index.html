<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radiosonicos - Tu Radio Online</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --accent-color: #ff9900;
            --text-color: #e0e0e0;
            --card-bg: #2b2b2b;
            --logo-color: #555;
            --logo-spacing: 50px;
            --scroll-speed: 25s;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 95vh; 
            margin: 0;
            background-color: var(--bg-color); 
            background-image: linear-gradient(135deg, #121212 25%, #1a1a1a 100%);
            color: var(--text-color);
            font-family: 'Arial', sans-serif;
            text-align: center;
            padding: 20px 0;
            overflow-x: hidden;
        }

        h1 {
            margin-bottom: 5px; 
            color: var(--accent-color); 
            text-shadow: 0 0 10px rgba(255, 153, 0, 0.5);
            margin-top: -30px; 
        }
        
        .subtitle {
            font-size: 1.2em;
            margin-bottom: 25px;
            color: #aaa;
        }

        .player-wrapper {
            width: 90%;
            max-width: 450px; 
            padding: 15px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
            border: 1px solid #444;
            margin-bottom: 20px;
        }

        audio {
            width: 100%;
            filter: invert(1);
        }
        
        .status-message {
            margin-top: 10px;
            font-size: 1em;
            color: var(--accent-color);
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        .marquee-container {
            width: 100%;
            margin-top: 40px;
            padding: 10px 0;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
            overflow: hidden; 
            white-space: nowrap; 
        }

        .marquee-content {
            display: inline-block;
            animation: marquee var(--scroll-speed) linear infinite;
        }

        .brand-logo {
            display: inline-block;
            color: var(--logo-color);
            font-size: 1.2em;
            font-weight: bold;
            margin: 0 var(--logo-spacing);
            text-transform: uppercase;
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        footer {
            margin-top: 20px;
            font-size: 0.8em;
            color: #666;
            padding: 10px;
        }

        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }
    </style>
</head>
<body>

    <h1>📻 Radiosonicos</h1>
    <p class="subtitle">¡La música que marcó una época! Sonando 24/7.</p>
    
    <div class="player-wrapper">
        <audio controls autoplay>
            <source src="http://82.145.41.8:35021/;stream" type="audio/mpeg">
            Tu navegador no soporta el audio.
        </audio>
    </div>

    <p class="status-message">Conéctate y disfruta de la mejor música</p>

    <div class="marquee-container">
        <div class="marquee-content" id="brandMarquee">
            <span class="brand-logo">Tu Empresa Aquí</span>
            <span class="brand-logo">Negocio Local</span>
            <span class="brand-logo">Bar</span>
            <span class="brand-logo">Tienda Retro</span>
            <span class="brand-logo">Gym Fitness</span>
            <span class="brand-logo">Automotriz</span>
        </div>
    </div>

    <footer>
        <p>© 2026 Radiosonicos. Todos los derechos reservados.</p>
        <p>Stream en alta calidad | Desarrollado por Marcelo Tonini.</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const marquee = document.getElementById('brandMarquee');
            marquee.innerHTML += marquee.innerHTML;
        });
    </script>

</body>
</html>
